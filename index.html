<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox CDN Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            cyber: {
              bg: '#0a0f0d',
              card: '#111a16',
              border: '#1b2e26',
              accent: '#10b981',
              glow: '#059669',
              dark: '#064e3b'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0a0f0d;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(5, 150, 105, 0.08) 0%, transparent 50%);
      min-height: 100vh;
    }
    .cyber-card {
      background: rgba(17, 26, 22, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(27, 46, 38, 0.8);
      box-shadow: 0 12px 40px -10px rgba(0, 0, 0, 0.7), 0 0 20px -5px rgba(16, 185, 129, 0.15);
    }
    .cyber-input {
      background: rgba(10, 15, 13, 0.8);
      border: 1px solid #1b2e26;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cyber-input:focus {
      border-color: #10b981;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.25);
      outline: none;
    }
    .cyber-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      transition: all 0.2s ease;
    }
    .cyber-btn:hover {
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
      transform: translateY(-1px);
    }
    .cyber-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body class="font-sans text-gray-200 antialiased flex flex-col justify-between min-h-screen">

  <div class="container mx-auto px-4 py-12 max-w-2xl flex-grow flex flex-col justify-center items-center">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-cyber-card border border-cyber-border mb-4 text-cyber-accent shadow-lg shadow-cyber-accent/10">
        <i class="fa-solid me-0 fa-cube text-3xl"></i>
      </div>
      <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-white mb-2">
        Roblox <span class="text-cyber-accent">CDN</span> Finder
      </h1>
      <p class="text-gray-400 text-sm sm:text-base">
        Dapatkan URL gambar asli <code class="font-mono text-cyber-accent bg-cyber-dark/40 px-2 py-0.5 rounded border border-cyber-accent/20">tr.rbxcdn.com</code> langsung dari username.
      </p>
    </div>

    <!-- Main Card -->
    <div class="w-full cyber-card rounded-2xl p-6 sm:p-8">
      
      <!-- Input & Controls -->
      <form id="searchForm" onsubmit="event.preventDefault(); fetchRobloxCDN();" class="space-y-5">
        
        <!-- Toggle Type -->
        <div class="flex justify-center p-1 bg-black/40 rounded-xl border border-cyber-border max-w-xs mx-auto mb-2">
          <button type="button" id="btnHeadshot" onclick="setType('headshot')" class="flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold transition-all duration-200 bg-cyber-accent text-black shadow">
            <i class="fa-solid fa-user-gear mr-1"></i> Headshot
          </button>
          <button type="button" id="btnFull" onclick="setType('full')" class="flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold text-gray-400 hover:text-white transition-all duration-200">
            <i class="fa-solid fa-person mr-1"></i> Full Body
          </button>
        </div>

        <!-- Username Input Group -->
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500">
            <i class="fa-solid fa-at"></i>
          </div>
          <input 
            type="text" 
            id="usernameInput" 
            placeholder="Masukkan username Roblox..." 
            class="w-full cyber-input text-white pl-11 pr-28 py-3.5 rounded-xl font-medium placeholder-gray-500 text-sm sm:text-base"
            required
            autocomplete="off"
          >
          <button 
            type="submit" 
            id="submitBtn"
            class="absolute right-1.5 top-1.5 bottom-1.5 cyber-btn text-black font-bold px-5 rounded-lg text-sm flex items-center justify-center gap-2"
          >
            <span>Cari</span>
            <i class="fa-solid fa-magnifying-glass text-xs"></i>
          </button>
        </div>
      </form>

      <!-- Status Indicator -->
      <div id="statusArea" class="hidden mt-6 p-4 rounded-xl text-sm font-medium border flex items-center gap-3">
        <i id="statusIcon" class="text-base"></i>
        <span id="statusMessage"></span>
      </div>

      <!-- Result Card -->
      <div id="resultArea" class="hidden mt-6 pt-6 border-t border-cyber-border">
        
        <div class="flex flex-col sm:flex-row items-center gap-6">
          <!-- Avatar Preview -->
          <div class="relative group">
            <div class="w-36 h-36 rounded-2xl bg-black/50 border border-cyber-border flex items-center justify-center overflow-hidden p-2 shadow-inner">
              <img id="avatarImg" src="" alt="Avatar Roblox" class="w-full h-full object-contain filter drop-shadow-md transition-transform duration-300 group-hover:scale-105">
            </div>
            <span class="absolute -bottom-2 -right-2 bg-cyber-accent text-black text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider">
              PNG 420px
            </span>
          </div>

          <!-- User Info & Link Box -->
          <div class="flex-1 w-full space-y-3">
            <div>
              <h2 id="displayNameText" class="text-lg font-bold text-white flex items-center gap-2">
                -
              </h2>
              <p id="usernameText" class="text-xs text-cyber-accent font-mono">@-</p>
              <p id="userIdText" class="text-[11px] text-gray-500 font-mono mt-0.5">ID: -</p>
            </div>

            <!-- CDN URL Output -->
            <div class="space-y-1.5">
              <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">URL CDN Gambar Direct:</label>
              <div class="flex items-center gap-2">
                <input 
                  type="text" 
                  id="cdnUrlInput" 
                  readonly 
                  class="w-full bg-black/60 border border-cyber-border text-gray-300 font-mono text-xs px-3 py-2 rounded-lg focus:outline-none select-all"
                >
                <button 
                  onclick="copyToClipboard()" 
                  id="copyBtn"
                  title="Salin URL"
                  class="bg-cyber-card hover:bg-cyber-border text-cyber-accent border border-cyber-border p-2 rounded-lg text-xs font-semibold transition-all shrink-0 flex items-center justify-center w-9 h-9"
                >
                  <i class="fa-regular fa-copy"></i>
                </button>
              </div>
            </div>

            <!-- Actions -->
            <div class="flex gap-2 pt-1">
              <a 
                id="openBtn" 
                href="#" 
                target="_blank" 
                class="flex-1 bg-cyber-card hover:bg-cyber-border text-gray-200 border border-cyber-border text-xs py-2 px-3 rounded-lg font-semibold text-center transition-all flex items-center justify-center gap-1.5"
              >
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> Buka Tab Baru
              </a>
            </div>

          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- Footer -->
  <footer class="text-center py-6 text-xs text-gray-600 border-t border-cyber-border/40">
    <p>Ditenagai oleh Vercel Serverless & Roblox API Publik</p>
      <p>ReiyaGT 2026</p>
  </footer>

  <script>
    let currentType = 'headshot';

    function setType(type) {
      currentType = type;
      const btnHead = document.getElementById('btnHeadshot');
      const btnFull = document.getElementById('btnFull');

      if (type === 'headshot') {
        btnHead.className = "flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold transition-all duration-200 bg-cyber-accent text-black shadow";
        btnFull.className = "flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold text-gray-400 hover:text-white transition-all duration-200";
      } else {
        btnFull.className = "flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold transition-all duration-200 bg-cyber-accent text-black shadow";
        btnHead.className = "flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold text-gray-400 hover:text-white transition-all duration-200";
      }

      // Jika input tidak kosong, jalankan pencarian ulang
      if(document.getElementById('usernameInput').value.trim() !== '') {
        fetchRobloxCDN();
      }
    }

    function showStatus(message, isError = false, isLoading = false) {
      const statusArea = document.getElementById('statusArea');
      const statusIcon = document.getElementById('statusIcon');
      const statusMessage = document.getElementById('statusMessage');

      statusArea.classList.remove('hidden', 'bg-red-950/40', 'border-red-800/50', 'text-red-300', 'bg-cyber-dark/30', 'border-cyber-accent/40', 'text-cyber-accent');

      if (isError) {
        statusArea.classList.add('bg-red-950/40', 'border-red-800/50', 'text-red-300');
        statusIcon.className = "fa-solid fa-triangle-exclamation";
      } else if (isLoading) {
        statusArea.classList.add('bg-cyber-dark/30', 'border-cyber-accent/40', 'text-cyber-accent');
        statusIcon.className = "fa-solid fa-spinner fa-spin";
      }

      statusMessage.textContent = message;
    }

    function hideStatus() {
      document.getElementById('statusArea').classList.add('hidden');
    }

    async function fetchRobloxCDN() {
      const username = document.getElementById('usernameInput').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const resultArea = document.getElementById('resultArea');

      if (!username) return;

      // Reset & UI Loading State
      resultArea.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75');
      showStatus(`Mencari data untuk @${username}...`, false, true);

      try {
        // Memanggil Serverless Function Vercel
        const response = await fetch(`/api/roblox?username=${encodeURIComponent(username)}&type=${currentType}`);
        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || 'Gagal mengambil data dari server.');
        }

        // Tampilkan Hasil
        document.getElementById('displayNameText').textContent = data.displayName;
        document.getElementById('usernameText').textContent = `@${data.name}`;
        document.getElementById('userIdText').textContent = `User ID: ${data.userId}`;
        document.getElementById('cdnUrlInput').value = data.imageUrl;
        document.getElementById('avatarImg').src = data.imageUrl;
        document.getElementById('openBtn').href = data.imageUrl;

        hideStatus();
        resultArea.classList.remove('hidden');

      } catch (err) {
        showStatus(err.message, true, false);
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75');
      }
    }

    function copyToClipboard() {
      const copyInput = document.getElementById('cdnUrlInput');
      const copyBtn = document.getElementById('copyBtn');

      copyInput.select();
      navigator.clipboard.writeText(copyInput.value);

      copyBtn.innerHTML = `<i class="fa-solid fa-check text-cyber-accent"></i>`;
      setTimeout(() => {
        copyBtn.innerHTML = `<i class="fa-regular fa-copy"></i>`;
      }, 2000);
    }
  </script>

</body>
</html>
